<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы (500) — Гимназия № 16</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7fb;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        .code {
            font-size: 4.5rem;
            font-weight: 800;
            color: #f59e0b;
            line-height: 1;
            margin-bottom: 0.75rem;
        }
        h2 { margin: 0 0 0.75rem; font-size: 1.5rem; }
        p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.75rem; }
        .btn {
            display: inline-block;
            background: #0f172a;
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.75rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <h2>Небольшая техническая пауза</h2>
        <p>
            На сервере произошёл временный сбой. Мы уже знаем о проблеме и скоро всё починим. Попробуйте обновить страницу через пару минут.
        </p>
        <a href="/" class="btn">Обновить и вернуться</a>
    </div>
</body>
</html>
