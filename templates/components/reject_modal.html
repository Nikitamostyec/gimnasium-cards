<details class="d-inline-block mt-1">
    <summary class="btn btn-outline-danger btn-sm">Отклонить</summary>
    <form method="post" action="{% url 'cards:change_request_status' req.pk 'reject' %}" class="card card-body p-3 mt-2 border-danger shadow-sm" style="min-width: 260px;">
        {% csrf_token %}
        <label class="form-label small fw-bold text-danger mb-1">Причина отклонения *</label>
        <textarea name="reason" rows="2" class="form-control form-control-sm mb-2" placeholder="Укажите причину отказа..." required></textarea>
        <button type="submit" class="btn btn-danger btn-sm w-100">Подтвердить отказ</button>
    </form>
</details>
