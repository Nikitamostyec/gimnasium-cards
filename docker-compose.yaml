services:
  db:
    image: postgres:16-alpine
    container_name: gimnasium_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gimnasium_db}
      POSTGRES_USER: ${POSTGRES_USER:-gimnasium_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_password_123}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gimnasium_user} -d ${POSTGRES_DB:-gimnasium_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: gimnasium_web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
